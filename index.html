
<!DOCTYPE html>
<html lang="en" style="scroll-padding-top: 80px;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Invitation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              accent: 'var(--color-accent)',
              muted: 'var(--color-muted)',
              bg: 'var(--color-bg)',
              text: 'var(--color-text)',
            },
            fontFamily: {
              display: ['var(--font-display)', 'serif'],
              body: ['var(--font-body)', 'sans-serif'],
              serif: ['var(--font-serif)', 'serif'],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Defaults which get overwritten by App.tsx */
        --color-primary: #A64B6D;
        --color-secondary: #A1B39D;
        --color-bg: #FCFAF7;
        --color-text: #2D2D2D;
        --font-display: 'Playfair Display', serif;
        --font-body: 'Montserrat', sans-serif;
        --font-serif: 'Cormorant Garamond', serif;
      }
      
      body {
        font-family: var(--font-body);
        background-color: var(--color-bg);
        color: var(--color-text);
        scroll-behavior: smooth;
        margin: 0;
        overflow-x: hidden;
      }

      .bg-islamic-pattern {
        background-color: transparent;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l5.878 18.09h19.021l-15.388 11.18 5.878 18.09-15.389-11.18-15.388 11.18 5.878-18.09L.101 18.09h19.021L30 0z' fill='currentColor' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
        color: var(--color-primary);
      }

      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .animate-fade-in { animation: fadeIn 1.5s ease-out forwards; }
      .animate-slide-up { animation: slideUp 1s ease-out forwards; }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--color-primary); border-radius: 10px; opacity: 0.5; }

      /* Mobile menu transition */
      .mobile-menu-enter { transform: translateY(-100%); transition: transform 0.3s ease-out; }
      .mobile-menu-enter-active { transform: translateY(0); }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
