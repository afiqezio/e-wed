
<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#241e15" />
    <title>Wedding Invitation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              accent: 'var(--color-accent)',
              muted: 'var(--color-muted)',
              bg: 'var(--color-bg)',
              text: 'var(--color-text)',
            },
            fontFamily: {
              display: ['var(--font-display)', 'serif'],
              body: ['var(--font-body)', 'sans-serif'],
              serif: ['var(--font-serif)', 'serif'],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Invitation (Walimah design system): Cormorant Garamond, Pinyon Script, Aref Ruqaa. Admin panel: Playfair Display, Montserrat. -->
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      /* Admin panel theme variables. The invitation itself is styled by styles/walimah.css. */
      :root {
        --color-primary: #A64B6D;
        --color-secondary: #A1B39D;
        --color-bg: #FCFAF7;
        --color-text: #2D2D2D;
        --font-display: 'Playfair Display', serif;
        --font-body: 'Montserrat', sans-serif;
      }

      html { background: #241e15; }

      body {
        margin: 0;
        overflow-x: hidden;
      }

      /* Loading splash: lives here so it paints before any script runs */
      .wl-splash { position: fixed; inset: 0; z-index: 80; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; background: #1c170f; color: #d8c49c; font-family: 'Cormorant Garamond', Garamond, serif; transition: opacity .6s cubic-bezier(.22,.61,.36,1); }
      .wl-splash[data-leaving="true"] { opacity: 0; pointer-events: none; }
      .wl-splash-glyph { font-size: 22px; line-height: 1; }
      .wl-splash-line { position: relative; width: 96px; height: 1px; overflow: hidden; background: rgba(216,196,156,.2); }
      .wl-splash-line::after { content: ''; position: absolute; inset: 0; background: #d8c49c; transform: translateX(-100%); animation: wl-splash 1.6s cubic-bezier(.22,.61,.36,1) infinite; }
      .wl-splash-text { font-size: 11px; font-weight: 500; letter-spacing: .26em; text-transform: uppercase; color: #a29478; }
      .wl-splash-message { max-width: 34ch; font-size: 18px; line-height: 1.6; color: #e9dfc8; }
      .wl-splash-button { padding: 12px 30px; background: transparent; border: 1px solid rgba(233,223,200,.62); color: #e9dfc8; font: 500 12px 'Cormorant Garamond', Garamond, serif; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
      @keyframes wl-splash { 0% { transform: translateX(-100%); } 60%, 100% { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { .wl-splash-line::after { animation: none; transform: none; opacity: .5; } }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "lenis": "https://esm.sh/lenis@^1.3.11"
      }
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="wl-splash" role="status" aria-label="Loading">
        <span class="wl-splash-glyph" aria-hidden="true">&#9880;&#65038;</span>
        <span class="wl-splash-line" aria-hidden="true"></span>
      </div>
    </div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
