
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Invitation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: 'var(--color-primary)',
              secondary: 'var(--color-secondary)',
              accent: 'var(--color-accent)',
              muted: 'var(--color-muted)',
              bg: 'var(--color-bg)',
              text: 'var(--color-text)',
            },
            fontFamily: {
              display: ['var(--font-display)', 'serif'],
              body: ['var(--font-body)', 'sans-serif'],
              serif: ['var(--font-serif)', 'serif'],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-primary: #A64B6D;
        --color-secondary: #A1B39D;
        --color-bg: #FCFAF7;
        --color-text: #2D2D2D;
        --font-display: 'Playfair Display', serif;
        --font-body: 'Montserrat', sans-serif;
        --font-serif: 'Cormorant Garamond', serif;
      }

      html {
        scroll-padding-top: 100px;
        scroll-behavior: smooth;
      }
      
      body {
        font-family: var(--font-body);
        background-color: var(--color-bg);
        color: var(--color-text);
        margin: 0;
        overflow-x: hidden;
      }

      .bg-islamic-pattern {
        background-color: transparent;
        background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0l5.878 18.09h19.021l-15.388 11.18 5.878 18.09-15.389-11.18-15.388 11.18 5.878-18.09L.101 18.09h19.021L30 0z' fill='currentColor' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
        color: var(--color-primary);
      }

      @keyframes floatBg {
        from { background-position: 0 0; }
        to { background-position: 600px 600px; }
      }

      .animate-float-slow {
        animation: floatBg 80s linear infinite;
      }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--color-primary); border-radius: 10px; }

      .reveal-on-scroll { opacity: 0; transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
      .reveal-on-scroll.active { opacity: 1; transform: translateY(0); }
      .reveal-on-scroll.slide-up { transform: translateY(40px); }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "framer-motion": "https://esm.sh/framer-motion@^11.11.11"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
